name: Build and Release Custom Card

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify build output
        run: |
          test -f network-flow-card.js
          echo "Main card:"
          ls -lh network-flow-card.js

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            network-flow-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}