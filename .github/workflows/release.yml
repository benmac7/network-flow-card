name: Build and Release Custom Card

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Bundle Lit dependency into card
        run: npm run build

      - name: Upload bundled JavaScript file to Release
        uses: softprops/action-gh-release@v2
        with:
          files: network-flow-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
